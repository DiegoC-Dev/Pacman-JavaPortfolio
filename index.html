<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pacman Game - Java Portfolio</title>
    <!-- CheerpJ WebAssembly Loader -->
    <script src="https://cjrtnc.leaningtech.com/3.0/cj3loader.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            min-height: 100%;
            background-color: #0b0b10;
            color: #ffe600;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: auto;
        }
        body {
            display: flex;
            padding: 10px;
        }
        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #ffe600;
            background-color: #0b0b10;
            z-index: 10;
        }
        .pac-loader {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #ffe600;
            clip-path: polygon(100% 0%, 50% 50%, 100% 100%, 0% 100%, 0% 0%);
            animation: chomp 0.4s ease-in-out infinite alternate;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(255, 230, 0, 0.6);
        }
        @keyframes chomp {
            0% {
                clip-path: polygon(100% 0%, 50% 50%, 100% 100%, 0% 100%, 0% 0%);
            }
            100% {
                clip-path: polygon(100% 45%, 50% 50%, 100% 55%, 0% 100%, 0% 0%);
            }
        }
        #scale-box {
            margin: auto;
            position: relative;
            flex-shrink: 0;
            box-shadow: 0 0 35px rgba(33, 33, 222, 0.5);
            border-radius: 12px;
            overflow: hidden;
        }
        #game-wrapper {
            width: 425px;
            height: 545px;
            transform-origin: top left;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="pac-loader"></div>
        <p>Cargando Pacman en el navegador...</p>
    </div>
    <div id="scale-box">
        <div id="game-wrapper"></div>
    </div>

    <script>
        const DISPLAY_W = 425;
        const DISPLAY_H = 545;

        function fitGameToViewport() {
            const box = document.getElementById('scale-box');
            const wrapper = document.getElementById('game-wrapper');
            if (!box || !wrapper) return;
            const availW = Math.max(240, window.innerWidth - 20);
            const availH = Math.max(300, window.innerHeight - 20);
            const scale = Math.min(1, availW / DISPLAY_W, availH / DISPLAY_H);
            wrapper.style.transform = `scale(${scale})`;
            box.style.width = `${Math.floor(DISPLAY_W * scale)}px`;
            box.style.height = `${Math.floor(DISPLAY_H * scale)}px`;
        }

        window.addEventListener('resize', fitGameToViewport);
        window.addEventListener('keydown', function (e) {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
                e.preventDefault();
            }
        }, { passive: false });

        fitGameToViewport();

        async function run() {
            try {
                await cheerpjInit();
                cheerpjCreateDisplay(DISPLAY_W, DISPLAY_H, document.getElementById('game-wrapper'));
                const loading = document.getElementById('loading');
                if (loading) loading.style.display = 'none';
                fitGameToViewport();
                await cheerpjRunJar("/app/Pacman.jar");
            } catch (err) {
                console.error("Error al iniciar CheerpJ:", err);
                const loading = document.getElementById('loading');
                if (loading) loading.innerHTML = '<p style="color: #ff4444;">Error al cargar el juego: ' + (err.message || err) + '</p>';
            }
        }
        run();
    </script>
</body>
</html>
